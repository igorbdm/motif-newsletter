name: Enviar Music Weekly

on:
  schedule:
    - cron: "48 9 * * 5"
      timezone: "America/Sao_Paulo"
    - cron: "3 10 * * 5"
      timezone: "America/Sao_Paulo"
    - cron: "18 10 * * 5"
      timezone: "America/Sao_Paulo"
    - cron: "33 10 * * 5"
      timezone: "America/Sao_Paulo"
    - cron: "48 10 * * 5"
      timezone: "America/Sao_Paulo"
    - cron: "3 11 * * 5"
      timezone: "America/Sao_Paulo"
    - cron: "18 11 * * 5"
      timezone: "America/Sao_Paulo"
    - cron: "33 11 * * 5"
      timezone: "America/Sao_Paulo"
    - cron: "48 11 * * 5"
      timezone: "America/Sao_Paulo"
    - cron: "3 12 * * 5"
      timezone: "America/Sao_Paulo"
    - cron: "18 12 * * 5"
      timezone: "America/Sao_Paulo"
    - cron: "33 12 * * 5"
      timezone: "America/Sao_Paulo"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: music-weekly-send
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      EMAIL_DELIVERY_PROVIDER: kit
      KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
      KIT_SENDER_EMAIL: newsletter@motifnewsletter.com
      KIT_PUBLISH_TO_WEB: "false"
      KIT_SEND_DELAY_MINUTES: "1"
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt

      - name: Gerar e enviar newsletter
        run: python src/main.py
